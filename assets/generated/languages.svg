<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-label="Lenguajes más usados: TypeScript 69%, Dart 15%, JavaScript 7%, CSS 4%, HTML 4%, Python 2%">
  <defs>
