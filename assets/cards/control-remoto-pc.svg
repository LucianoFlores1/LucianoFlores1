<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-label="Control Remoto PC — Tu celular Android como mouse y teclado inalámbrico de Windows por WiFi: touchpad, tipeo, Alt+Tab y conexión por QR.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1120"/><stop offset="1" stop-color="#07080F"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399" stop-opacity="0"/><stop offset=".5" stop-color="#34D399"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#34D399" stop-opacity=".22"/><stop offset=".6" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" opacity=".05"/></pattern>
    <clipPath id="c"><rect width="600" height="250" rx="16"/></clipPath>
    <style>
      .beam { animation: beam 4s ease-in-out infinite; }
      @keyframes beam { 0% { transform: translateX(-260px); } 100% { transform: translateX(600px); } }
      .pulse { animation: pulse 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="600" height="250" fill="url(#bg)"/>
    <rect width="600" height="250" fill="url(#dots)"/>
    <rect width="600" height="250" fill="url(#halo)"/>
    <text x="564" y="150" text-anchor="end" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,'Liberation Mono',monospace" font-size="120" font-weight="700" fill="#34D399" opacity=".07">◎</text>
    <rect class="beam" x="0" y="0" width="260" height="2" fill="url(#beam)" style="animation-delay:-2.0999999999999996s"/>
  </g>
  <rect x=".75" y=".75" width="598.5" height="248.5" rx="15.5" fill="none" stroke="#34D399" stroke-opacity=".35" stroke-width="1.5"/>
  <g stroke="#34D399" stroke-width="2.5" fill="none" stroke-linecap="square">
    <path d="M14 30 V14 H30"/><path d="M570 236 H586 V220"/>
  </g>
  <g font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,'Liberation Mono',monospace">
    <text x="32" y="44" font-size="12.5" letter-spacing="3" fill="#34D399">STAGE 04</text>
    <circle class="pulse" cx="500.79999999999995" cy="40" r="4.5" fill="#94A3B8"/>
    <text x="568" y="44" text-anchor="end" font-size="12" letter-spacing="2" fill="#94A3B8">SOURCE</text>
    <g transform="translate(32 196)"><rect width="68" height="26" rx="6" fill="#34D399" fill-opacity=".08" stroke="#34D399" stroke-opacity=".45"/><text x="34" y="17.5" text-anchor="middle" font-size="12.5" fill="#E2E8F0">Python</text></g><g transform="translate(108 196)"><rect width="99" height="26" rx="6" fill="#34D399" fill-opacity=".08" stroke="#34D399" stroke-opacity=".45"/><text x="49.5" y="17.5" text-anchor="middle" font-size="12.5" fill="#E2E8F0">JavaScript</text></g><g transform="translate(215 196)"><rect width="53" height="26" rx="6" fill="#34D399" fill-opacity=".08" stroke="#34D399" stroke-opacity=".45"/><text x="26.5" y="17.5" text-anchor="middle" font-size="12.5" fill="#E2E8F0">WiFi</text></g><g transform="translate(276 196)"><rect width="37" height="26" rx="6" fill="#34D399" fill-opacity=".08" stroke="#34D399" stroke-opacity=".45"/><text x="18.5" y="17.5" text-anchor="middle" font-size="12.5" fill="#E2E8F0">QR</text></g>
  </g>
  <text x="32" y="86" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#F8FAFC">Control Remoto PC</text>
  <text x="32" y="122" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#A5B4C8"><tspan x="32" dy="0">Tu celular Android como mouse y teclado inalámbrico de</tspan><tspan x="32" dy="21">Windows por WiFi: touchpad, tipeo, Alt+Tab y conexión por</tspan><tspan x="32" dy="21">QR.</tspan></text>
</svg>
