<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Luciano Flores — Software Engineer, Full Stack. Salta, Argentina">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060D"/>
      <stop offset="0.65" stop-color="#140A2A"/>
      <stop offset="1" stop-color="#2A0B3D"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE047"/>
      <stop offset="0.45" stop-color="#FB923C"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A0630"/>
      <stop offset="1" stop-color="#05060D"/>
    </linearGradient>
    <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="sunStripes">
      <rect x="760" y="100" width="300" height="200" fill="#fff"/>
      <rect x="760" y="206" width="300" height="4" fill="#000"/>
      <rect x="760" y="222" width="300" height="6" fill="#000"/>
      <rect x="760" y="240" width="300" height="8" fill="#000"/>
      <rect x="760" y="258" width="300" height="10" fill="#000"/>
    </mask>
    <mask id="floorFade">
      <rect x="0" y="272" width="1200" height="108" fill="url(#fadeTop)"/>
    </mask>
    <clipPath id="floorClip"><rect x="0" y="272" width="1200" height="108"/></clipPath>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.35"/>
    </pattern>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="t1"><rect x="96" y="188" height="34" width="0">
      <animate attributeName="width" dur="12s" begin="0s" repeatCount="indefinite" values="0;400;400;0;0" keyTimes="0;0.12;0.27;0.32;1"/>
    </rect></clipPath>
    <clipPath id="t2"><rect x="96" y="188" height="34" width="0">
      <animate attributeName="width" dur="12s" begin="4s" repeatCount="indefinite" values="0;510;510;0;0" keyTimes="0;0.12;0.27;0.32;1"/>
    </rect></clipPath>
    <clipPath id="t3"><rect x="96" y="188" height="34" width="0">
      <animate attributeName="width" dur="12s" begin="8s" repeatCount="indefinite" values="0;490;490;0;0" keyTimes="0;0.12;0.27;0.32;1"/>
    </rect></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code','SF Mono',Consolas,'Liberation Mono',monospace; }
      .hl { animation: floorline 3s cubic-bezier(.55,0,1,.45) infinite; opacity: 0; }
      @keyframes floorline { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(110px); opacity: 1; } }
      .star { animation: twinkle 3.2s ease-in-out infinite; }
      @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
      .glitch-a { animation: gA 5s steps(1) infinite; }
      .glitch-b { animation: gB 5s steps(1) infinite; }
      @keyframes gA { 0%,86%,100% { transform: translate(0,0); } 88% { transform: translate(-4px,1px); } 90% { transform: translate(3px,-2px); } 92% { transform: translate(-2px,0); } }
      @keyframes gB { 0%,86%,100% { transform: translate(0,0); } 88% { transform: translate(4px,-1px); } 90% { transform: translate(-3px,2px); } 92% { transform: translate(2px,0); } }
      .sunpulse { animation: sp 6s ease-in-out infinite; transform-origin: 910px 240px; }
      @keyframes sp { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- sky -->
  <rect width="1200" height="380" fill="url(#sky)"/>
  <g fill="#E0F2FE">
    <circle class="star" cx="520" cy="40" r="1.4"/>
    <circle class="star" cx="640" cy="92" r="1" style="animation-delay:-1s"/>
    <circle class="star" cx="720" cy="30" r="1.6" style="animation-delay:-2s"/>
    <circle class="star" cx="1080" cy="60" r="1.2" style="animation-delay:-.5s"/>
    <circle class="star" cx="1150" cy="130" r="1" style="animation-delay:-1.7s"/>
    <circle class="star" cx="820" cy="70" r="1.1" style="animation-delay:-2.6s"/>
    <circle class="star" cx="40" cy="30" r="1.2" style="animation-delay:-1.2s"/>
    <circle class="star" cx="590" cy="150" r="1" style="animation-delay:-2.2s"/>
    <circle class="star" cx="1010" cy="24" r="1.3" style="animation-delay:-.8s"/>
  </g>

  <!-- retro sun -->
  <g class="sunpulse" filter="url(#glow)">
    <circle cx="910" cy="240" r="120" fill="url(#sun)" mask="url(#sunStripes)"/>
  </g>

  <!-- Andes (Salta) -->
  <path d="M600 272 L660 236 L700 250 L760 196 L800 224 L842 180 L880 214 L930 170 L975 222 L1010 200 L1060 238 L1110 214 L1160 246 L1200 232 L1200 272 Z" fill="#12051F" stroke="#F472B6" stroke-width="1.5" stroke-opacity=".8"/>
  <path d="M470 272 L540 250 L600 262 L680 244 L760 262 L840 246 L930 262 L1020 250 L1120 264 L1200 256 L1200 272 Z" fill="#0A0314" stroke="#22D3EE" stroke-width="1" stroke-opacity=".55"/>

  <!-- neon floor -->
  <rect x="0" y="272" width="1200" height="108" fill="url(#floor)"/>
  <g clip-path="url(#floorClip)" mask="url(#floorFade)" stroke="#D946EF" stroke-width="1.4">
    <line x1="0" y1="272" x2="1200" y2="272" stroke="#22D3EE" stroke-width="2"/>
    <g stroke-opacity=".7">
      <line x1="600" y1="272" x2="-900" y2="380"/><line x1="600" y1="272" x2="-500" y2="380"/>
      <line x1="600" y1="272" x2="-150" y2="380"/><line x1="600" y1="272" x2="150" y2="380"/>
      <line x1="600" y1="272" x2="390" y2="380"/><line x1="600" y1="272" x2="600" y2="380"/>
      <line x1="600" y1="272" x2="810" y2="380"/><line x1="600" y1="272" x2="1050" y2="380"/>
      <line x1="600" y1="272" x2="1350" y2="380"/><line x1="600" y1="272" x2="1700" y2="380"/>
      <line x1="600" y1="272" x2="2100" y2="380"/>
    </g>
    <line class="hl" x1="0" y1="272" x2="1200" y2="272"/>
    <line class="hl" x1="0" y1="272" x2="1200" y2="272" style="animation-delay:-.6s"/>
    <line class="hl" x1="0" y1="272" x2="1200" y2="272" style="animation-delay:-1.2s"/>
    <line class="hl" x1="0" y1="272" x2="1200" y2="272" style="animation-delay:-1.8s"/>
    <line class="hl" x1="0" y1="272" x2="1200" y2="272" style="animation-delay:-2.4s"/>
  </g>

  <!-- copy -->
  <g class="mono">
    <text x="72" y="84" font-size="15" letter-spacing="4" fill="#22D3EE">// PLAYER_01 · SALTA, ARGENTINA</text>
    <g font-size="68" font-weight="800" letter-spacing="1">
      <text class="glitch-a" x="72" y="158" fill="#22D3EE" opacity=".85">LUCIANO FLORES</text>
      <text class="glitch-b" x="72" y="158" fill="#F472B6" opacity=".85">LUCIANO FLORES</text>
      <text x="72" y="158" fill="#F8FAFC">LUCIANO FLORES</text>
    </g>
    <text x="72" y="212" font-size="22" fill="#FBBF24">&gt;</text>
    <g font-size="22" fill="#FDE68A">
      <text x="96" y="212" clip-path="url(#t1)">Software Engineer · Full Stack</text>
      <text x="96" y="212" clip-path="url(#t2)">React · Next.js · TypeScript · Flutter</text>
      <text x="96" y="212" clip-path="url(#t3)">Construyo productos que la gente usa</text>
    </g>
    <text x="72" y="250" font-size="13" letter-spacing="2" fill="#94A3B8">WEB · MOBILE · AUTOMATIZACIÓN · QA<tspan class="blink" fill="#22D3EE"> █</tspan></text>
  </g>

  <!-- CRT -->
  <rect width="1200" height="380" fill="url(#scan)"/>
  <rect width="1200" height="380" fill="url(#vignette)"/>
</svg>
