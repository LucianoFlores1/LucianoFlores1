name: Actualizar estadísticas

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/stats.yml"]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generar SVGs
        env:
          # Opcional: crea el secret GH_STATS_TOKEN (PAT con read:user y repo) para contar también actividad privada.
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          node scripts/build-cards.mjs
          node scripts/build-stats.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: actualizar estadísticas"
          git push
